name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
          # resolve to the latest patch release so govulncheck does not flag
          # stdlib vulnerabilities already fixed upstream
          check-latest: true

      - run: go vet ./...
      - run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: apps/api

        # Informational only: stdlib CVEs are published faster than patch
        # releases land, so a blocking scan would break CI for reasons
        # unrelated to the code. Module-level findings still need attention.
      - name: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  site:
    name: site (nuxt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    env:
      NUXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: docker build (local stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

        # compose requires env_file to exist; the example is enough to build images
      - run: cp deploy/local/.env.example deploy/local/.env
      - run: docker compose -f deploy/local/compose.yaml build
