name: portfolio-dev

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/dev/docker/api.dockerfile
    # optional: copy docker/.env.example to docker/.env to override dev defaults
    env_file:
      - path: ./docker/.env
        required: false
    environment:
      PORT: '8080'
      DATA_DIR: /data
    volumes:
      - ../../apps/api:/app
      - ./data:/data
      - api-gomod:/go/pkg/mod
      - api-gocache:/root/.cache/go-build
    ports:
      - '8080:8080'
    healthcheck:
      # air rebuilds the binary on start (and on every change), so keep a generous start_period
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  site:
    build:
      context: ../..
      dockerfile: deploy/dev/docker/site.dockerfile
    environment:
      NUXT_API_PROXY: http://api:8080
      NUXT_TELEMETRY_DISABLED: '1'
      CHOKIDAR_USEPOLLING: '1'
    volumes:
      - ../../apps/site:/app
      - /app/node_modules
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  api-gomod:
  api-gocache:
